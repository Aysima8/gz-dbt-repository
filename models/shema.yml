version: 2

sources:
  - name: raw
    schema: gz_raw_data

    tables:
      - name: product
        identifier: raw_products
        description: "product data for Greenweez"
        columns:
          - name: products_id
            description: "Primary key"
            tests:
              - unique
              - not_null

          - name: purchase_price
            description: "the purchase price of the product"

      - name: sales
        identifier: raw_sales
        description: "sales data for Greenweez orders"

      - name: ship
        identifier: raw_ship
        description: "shipping data for Greenweez orders"
        columns:
          - name: orders_id
            description: "Primary key"
            tests:
              - unique
              - not_null

          - name: shipping_fee
            description: "the price the customer pays for shipping"

          - name: log_cost
            description: "the cost of preparing the parcel in the distribution centre/warehouse"

          - name: ship_cost
            description: "shipping cost paid by Greenweez to the carrier/logistics provider"